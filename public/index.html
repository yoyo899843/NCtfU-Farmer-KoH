<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCtfU 農場</title>
  <link rel="icon" type="image/jpeg" href="/images/white_base_logo.jpg">
  <style>
    :root {
      --cream: #f4f5ed;
      --panel: #ffffff;
      --line: #d5dce4;
      --ink: #1f2a38;
      --muted: #526276;
      --green: #42566e;
      --green-soft: #e7edf3;
      --soil: #d2b48c;
      --soil-line: #9b754e;
      --gold: #b4881f;
      --gold-soft: #fbf1d8;
      font-family: system-ui, "Noto Sans TC", sans-serif;
      color: var(--ink);
      background: var(--cream);
    }
    * { box-sizing: border-box; }
    body { max-width: 1120px; margin: 0 auto; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; letter-spacing: .04em; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .small { font-size: .85rem; color: var(--muted); }

    /* 標題列：左邊標題，右邊活動狀態 */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #42566e;
      color: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .topbar h1 { margin: 0; font-size: 1.5rem; letter-spacing: .06em; }
    .logo { width: 38px; height: 38px; display: block; object-fit: contain; padding: 3px; background: #fff; border-radius: 8px; }

    /* 活動狀態（標題列右側）*/
    .status { text-align: right; line-height: 1.35; }
    #phase-label { display: block; font-size: 1.05rem; font-weight: 700; }
    #phase-countdown { font-size: .9rem; color: #e4ebf3; font-variant-numeric: tabular-nums; }

    /* 公告區 */
    #announcements-panel { border-left: 6px solid var(--gold); margin-bottom: 14px; }
    #announcements { list-style: none; margin: 0; padding: 0; }
    #announcements li { display: flex; gap: 10px; padding: 7px 0; align-items: baseline; }
    #announcements li + li { border-top: 1px dashed var(--line); }
    #announcements time { flex: none; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    #announcements span { white-space: pre-wrap; overflow-wrap: anywhere; }

    /* 主要版面：左農地、右（玩家資訊 + 購物中心） */
    .layout { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; align-items: start; }
    .side { display: grid; gap: 14px; }

    /* 農地：土地底圖用 Farm.jpg */
    .plots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .plot {
      position: relative; overflow: hidden;
      aspect-ratio: 1 / 1; min-height: 150px; padding: 12px;
      background: var(--soil) url('/images/Farm.jpg') center / cover no-repeat;
      border: 3px solid var(--soil-line); border-radius: 10px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    }
    /* 作物圖擺正中央當底層，文字與按鈕浮在上面 */
    .crop-img {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 58%; max-width: 118px; aspect-ratio: 1 / 1; object-fit: contain;
      pointer-events: none; z-index: 0;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .35));
    }
    .plot > *:not(.crop-img) { position: relative; z-index: 1; }
    /* 疊在照片上，所以文字要有底才看得清楚 */
    .plot-label, .plot-crop, .crop-status {
      align-self: flex-start; padding: 1px 7px; border-radius: 6px;
      background: rgba(255, 255, 255, .82);
    }
    .plot-label { font-size: .8rem; color: #5c4324; letter-spacing: .08em; }
    .plot-crop { font-size: 1.2rem; font-weight: 700; }
    .crop-status { font-size: .9rem; font-variant-numeric: tabular-nums; }
    .plot select { width: 100%; max-width: none; }
    .plot .row { display: grid; gap: 6px; }
    #notice { min-height: 1.4em; margin: 12px 0 0; color: #92400e; }

    /* 玩家資訊 */
    .stat { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; }
    .stat + .stat { border-top: 1px dashed var(--line); }
    .stat b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .player-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    #welcome { display: block; font-size: 1.2rem; font-weight: 700; }
    #logout-player { padding: 5px 10px; font-size: .85rem; background: #fff; }

    /* 購物中心：買／賣分頁 */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .tabs button { background: #f1f4f7; border-color: var(--line); }
    .tabs button[aria-selected="true"] { background: var(--green); border-color: var(--green); color: #fff; }
    .shop-row, .stock-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .shop-row:last-child, .stock-row:last-child { border-bottom: 0; }
    .shop-row input { width: 64px; }
    .shop-buy { display: flex; gap: 6px; align-items: center; }

    /* 排行榜 */
    .ranks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .rank-round { background: var(--green-soft); border-color: #c5d0dc; }
    .rank-total { background: var(--gold-soft); border-color: #e6d4a3; }
    .ranks ol { margin: 0; padding-left: 22px; }
    .ranks li { padding: 5px 0; font-size: 1.05rem; }

    button { padding: 8px 12px; cursor: pointer; border: 1px solid var(--green); background: var(--green-soft); border-radius: 8px; font: inherit; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select { padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; max-width: 220px; }
    body.round-inactive #farm-panel button, body.round-inactive #hidden-farm-panel button,
    body.round-inactive #shop-panel button:not(.tab) { pointer-events: none; opacity: .45; }
    #game { display: none; }

    /* 隱藏農地：4×4，格子比主農地小一點才排得下 */
    #hidden-farm-panel { margin-top: 14px; border-left: 6px solid var(--gold); }
    .plots-hidden { grid-template-columns: repeat(4, 1fr); }
    .plots-hidden .plot { min-height: 120px; }
    .plots-hidden .plot-crop { font-size: 1rem; }
    .plots-hidden .crop-status { font-size: .8rem; }

    @media (max-width: 900px) {
      .layout, .ranks { grid-template-columns: 1fr; }
      .plot { aspect-ratio: auto; min-height: 130px; }
      .plots-hidden { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img class="logo" src="/images/small_logo.png" alt="NCtfU logo">
      <h1>NCtfU 農場</h1>
    </div>
    <div class="status">
      <strong id="phase-label">等待主辦方開始</strong>
      <span id="phase-countdown"></span>
    </div>
  </div>

  <section id="login" class="panel">
    <h2>建立農場帳號</h2>
    <p><label>暱稱 <input id="nickname" maxlength="20" required></label></p>
    <p><label>6 位數 PIN <input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label></p>
    <button id="register">進入農場</button>
    <p id="login-error" role="alert"></p>
  </section>

  <main id="game">
    <section id="announcements-panel" class="panel" hidden>
      <h2>公告</h2>
      <ul id="announcements"></ul>
    </section>

    <div class="layout">
      <section id="farm-panel" class="panel">
        <h2>農地</h2>
        <div class="plots" id="plots"></div>
        <p id="notice" role="status"></p>
      </section>

      <div class="side">
        <section id="player-panel" class="panel">
          <div class="player-heading">
            <strong id="welcome"></strong>
            <button id="logout-player" type="button">登出</button>
          </div>
          <div class="stat"><span>金錢</span><b><span id="money">0</span> 元</b></div>
          <div class="stat"><span>本局分數</span><b id="score">0</b></div>
          <div class="stat"><span>累計分數</span><b id="cumulative-score">0</b></div>
        </section>

        <section id="shop-panel" class="panel">
          <h2>購物中心</h2>
          <div class="tabs" role="tablist">
            <button class="tab" id="tab-buy" role="tab" aria-selected="true">買種子</button>
            <button class="tab" id="tab-sell" role="tab" aria-selected="false">賣作物</button>
          </div>
          <div id="shop" role="tabpanel"></div>
          <div id="stock" role="tabpanel" hidden></div>
        </section>
      </div>
    </div>
    <section id="hidden-farm-panel" class="panel" hidden>
      <h2>其他田地</h2>
      <p class="small">台灣土地這麼貴你還可以一次擁有十六塊土地，好羨慕這麼有錢</p>
      <div class="plots plots-hidden" id="hidden-plots"></div>
    </section>

    <div class="ranks">
      <section class="panel rank-round">
        <h2>本局排行</h2>
        <ol id="round-leaderboard"></ol>
      </section>
      <section class="panel rank-total">
        <h2>總排行</h2>
        <ol id="cumulative-leaderboard"></ol>
        <p class="small" id="player-count"></p>
      </section>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
