<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>玩家管理 — NCtfU 農場管理台</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <div class="topbar">
    <h1>NCtfU 農場管理台</h1>
    <span class="topbar-right" id="topbar-actions">
      <a href="/">前往玩家頁面</a>
      <button id="logout">登出</button>
    </span>
  </div>

  <nav class="nav" id="admin-nav">
    <a href="/admin">活動控制</a>
    <a href="/admin/player" aria-current="page">玩家管理</a>
    <a href="/admin/announcement">公告管理</a>
    <a href="/scoreboard" target="_blank" rel="noopener">大螢幕戰況 ↗</a>
  </nav>

  <div id="admin-panel">
    <section>
      <h2>玩家帳號</h2>
      <div class="login-row">
        <button id="players-refresh">重新整理</button>
        <span class="small" id="players-count"></span>
      </div>
      <p class="notice" id="players-notice" role="status"></p>
      <ul id="players-list" class="record-list"></ul>
      <p class="small">「刪除」會一併清掉該玩家的累計分數、目前連線與本局資料，無法復原；對方的畫面會退回登入頁。忘記 PIN 的人用「重設 PIN」給一組新的六位數字即可，不影響他的分數。清單不會自動更新，操作後或按「重新整理」才重讀。</p>
    </section>
  </div>

  <script src="/admin/common.js"></script>
  <script src="/admin/player.js"></script>
</body>
</html>
